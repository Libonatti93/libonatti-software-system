server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;

  charset utf-8;
  etag on;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /robots.txt {
    default_type text/plain;
    try_files /robots.txt =404;
  }

  location = /llms.txt {
    default_type text/plain;
    try_files /llms.txt =404;
  }

  location = /sitemap.xml {
    default_type application/xml;
    try_files /sitemap.xml =404;
  }

  location = / {
    return 302 /pt-br/;
  }

  location ~ ^/(pt-br|es|en)/?$ {
    try_files /index.html =404;
  }

  location ~ ^/(pt-br|es|en)/blog/?$ {
    try_files /blog.html =404;
  }

  location = /pt-br/projetos/nogueira-cardiologia/ {
    try_files /projects/nogueira-cardiologia/pt-br.html =404;
  }

  location = /es/proyectos/nogueira-cardiologia/ {
    try_files /projects/nogueira-cardiologia/es.html =404;
  }

  location = /en/projects/nogueira-cardiologia/ {
    try_files /projects/nogueira-cardiologia/en.html =404;
  }

  location = /pt-br/projetos/tripoli/ {
    try_files /projects/tripoli/pt-br.html =404;
  }

  location = /es/proyectos/tripoli/ {
    try_files /projects/tripoli/es.html =404;
  }

  location = /en/projects/tripoli/ {
    try_files /projects/tripoli/en.html =404;
  }

  location = /pt-br/projetos/etranslink/ {
    try_files /projects/etranslink/pt-br.html =404;
  }

  location = /es/proyectos/etranslink/ {
    try_files /projects/etranslink/es.html =404;
  }

  location = /en/projects/etranslink/ {
    try_files /projects/etranslink/en.html =404;
  }

  location = /pt-br/projetos/lios/ {
    try_files /projects/lios/pt-br.html =404;
  }

  location = /es/proyectos/lios/ {
    try_files /projects/lios/es.html =404;
  }

  location = /en/projects/lios/ {
    try_files /projects/lios/en.html =404;
  }

  location = /es-ar/ {
    return 301 /es/;
  }

  location = /es-ar/blog/ {
    return 301 /es/blog/;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }
}
